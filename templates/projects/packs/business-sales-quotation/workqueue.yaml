# 販売見積 / Sales quotation policy (example; adjust to your approval authority table).
# A quotation is a commercial offer: it is prepared here, approved by people and sent by a person.
version: 1
timezone: Asia/Tokyo
separationOfDuties: true
access:
  fallback: none
queues:
  - id: sales-quotes
    department: sales
    name: { ja: 見積依頼, en: Quotation requests }
    types: [quote]
    slaHours: 24
    defaultAgent: main
rules:
  # Figures computed by Kurahi when quote.prepare writes the quotation (quoteNumber, quoteTotal,
  # quoteUnpriced, quoteZeroRate, and quoteDocument / quoteWorkbook: the SHA-256 of the exact
  # files a person approves). Changing the item's source clears earlier approvals.
  - id: quote.generated
    kind: required
    fields: [quoteNumber]
    label: { ja: 見積書が Kurahi で作成されていること, en: The quotation was generated by Kurahi }
  # Overriding these two approves a PROVISIONAL estimate only (御見積書（暫定）, open items
  # visible, the person who authorised the release recorded), never a final quotation.
  - id: quote.complete
    kind: threshold
    field: quoteUnpriced
    max: 0
    overrideOutcome: provisional
    label:
      ja: 価格未設定の品目がないこと（理由を記録して承認すると暫定見積としての発行になります）
      en: No unpriced items (approving with a reason releases a provisional estimate only)
  - id: quote.taxclass
    kind: threshold
    field: quoteZeroRate
    max: 0
    overrideOutcome: provisional
    label:
      ja: 税率 0% の品目がないこと（非課税・不課税・輸出免税の区分は未対応のため、正式な見積書にできません）
      en: No 0% lines (非課税, 不課税 and export exemption are not distinguished yet, so no final quotation)
  # Days the price list is past quotes/company.json priceListMaxAgeDays (default 180), so this
  # rule follows the company's limit. The date is the file's last change, which a copy or
  # checkout can reset: a pass proves nothing, a failure asks a person to confirm the prices and
  # record how in the override reason.
  - id: quote.price-list-current
    kind: threshold
    field: quotePriceListOverdueDays
    max: 0
    label:
      ja: 価格表が社内の更新期限内であること（期限超過時は価格が最新であることを確認し、確認方法を理由に記録して承認）
      en: The price list is within the company's update limit (if overdue, confirm the prices are current and record how in the reason)
  - id: quote.amount
    kind: threshold
    field: quoteTotal
    secondApproverAbove: 1000000
    label:
      {
        ja: 合計（税込）100万円超は二名承認,
        en: "Total above 1,000,000 JPY incl. tax: second approver",
      }
  - id: quote.document
    kind: attachment
    min: 1
    label: { ja: 見積書が添付されていること, en: The quotation document is attached }
  - id: quote.no-commitments
    kind: forbiddenPhrases
    target: draft
    phrases:
      [
        送付済み,
        受注しました,
        受注確定,
        契約成立,
        発注を承りました,
        order confirmed,
        order accepted,
      ]
    label:
      ja: 承認前に送付・受注・契約を確定したと書かない
      en: Do not state that the quotation was sent or the order accepted before approval
routes:
  - id: quote-standard
    name: { ja: 見積承認, en: Quotation approval }
    queues: [sales-quotes]
    stages:
      - id: sales-lead
        name: { ja: 営業担当リーダー, en: Sales lead }
        approvers: { roles: [approver] }
        minApprovals: 1
        dueHours: 24
        onReturn: requester
        delegation: true
