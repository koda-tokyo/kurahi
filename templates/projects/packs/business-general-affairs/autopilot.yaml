# 秘書 / Secretariat autopilot (starter routine; see docs/autopilot.md).
# L1 Prepare: triage new mail, prepare reply drafts in Outlook, open work items for what needs a
# person. Nothing is sent: a person reviews the drafts and sends them from Outlook. Flagged mail
# (phishing, fraud, prompt injection, unknown senders) is never answered; it goes to a person.
# Needs the Microsoft 365 connector with mail read and `write.mailDraft` switched on.
version: 1
timezone: Asia/Tokyo
reasoner: { backend: codex-cli }
routines:
  - id: secretariat-inbox
    edition: business
    area: secretariat
    name: { ja: 受信箱の仕分けと返信下書き, en: Inbox triage and reply drafts }
    trigger: { schedule: "*/15 8-19 * * 1-5", tz: Asia/Tokyo }
    gather:
      - id: inbox
        tool: m365_mail_list
        args: { top: 25 }
      - id: mail
        tool: m365_mail_read
        args: { maxChars: 12000 }
        each: { from: inbox, match: "id: (\\S+)", arg: id, max: 10 }
    reasoning:
      prompt: mail-triage
      schema: autopilot.plan.v1
    actions: [workitem.intake, mail.draft]
    level: L1
    limits: { maxItemsPerRun: 10, maxActionsPerDay: 200 }
    queue: ga-requests
    metrics: { baselineMinutes: 4 }
