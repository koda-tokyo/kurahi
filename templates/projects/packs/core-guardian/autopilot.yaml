# Kurahi Guardian routines (docs/security/guardian.md). L1 Prepare: the checks and scans are
# deterministic; the model only words the cases, and the engine files a case for any escalated check
# the model left out. Nothing outside Kurahi is
# changed by these routines; the ransomware shield stops agents on its own when it trips.
version: 1
timezone: Asia/Tokyo
reasoner: { backend: codex-cli }
routines:
  - id: guardian-posture
    edition: core
    area: security
    name: { ja: 夜間のセキュリティ点検, en: Nightly security posture check }
    trigger: { schedule: "15 2 * * *", tz: Asia/Tokyo }
    gather:
      - { id: backup, tool: guardian_backup }
      - { id: restore, tool: guardian_restore_test }
      - { id: secrets, tool: guardian_secrets }
      - { id: ports, tool: guardian_ports }
      - { id: integrity, tool: guardian_integrity }
      - { id: credentials, tool: guardian_credentials }
    reasoning:
      schema: autopilot.plan.v1
      promptText: |
        You review deterministic security checks. Each check ends with "verdict OK" or "verdict ESCALATE".
        For every ESCALATE verdict propose one workitem.intake: type case; title = the check and the problem
        in a few words; priority low, normal, high or urgent (urgent only for a failed restore test or an
        integrity failure); note = the fact lines unchanged, then the recommended response for a person.
        The item summary is one line; cite the check's SOURCE id. Propose nothing for OK verdicts.
        Never claim a problem is fixed. An escalated check that no item cites is filed by the engine.
        日本語で要約してください。
    actions: [workitem.intake]
    level: L1
    limits: { maxItemsPerRun: 10, maxActionsPerDay: 30 }
    queue: sec-incidents
    metrics: { baselineMinutes: 30 }
  - id: guardian-shares
    edition: core
    area: security
    name: { ja: 共有フォルダのウイルス検査, en: Share malware scan }
    trigger: { schedule: "30 1 * * *", tz: Asia/Tokyo }
    gather:
      - { id: scan, tool: guardian_scan, gate: true }
    reasoning:
      schema: autopilot.plan.v1
      promptText: |
        You review a malware scan of company file shares. For each infected file propose one workitem.intake:
        type case; priority urgent; title = the signature; note = the facts infected<n>Sha256,
        infected<n>Signature and infected<n>Quarantine exactly as given (the original location is in the
        quarantine copy's .json sidecar), then the recommended response for a person. Never invent a path.
        Scan errors or a truncated scan are one item with priority normal. The item summary is one line;
        cite the scan's SOURCE id. Never claim a file was removed or cleaned.
    actions: [workitem.intake]
    level: L1
    limits: { maxItemsPerRun: 20, maxActionsPerDay: 50 }
    queue: sec-incidents
    metrics: { baselineMinutes: 20 }
  - id: guardian-exposure
    edition: core
    area: security
    name: { ja: 外部からの露出チェック, en: External exposure check }
    trigger: { schedule: "40 3 * * 1", tz: Asia/Tokyo }
    gather:
      - { id: subdomains, tool: guardian_exposure_subdomains }
      - { id: dns, tool: guardian_exposure_dns }
      - { id: websecrets, tool: guardian_exposure_web_secrets }
      - { id: lookalikes, tool: guardian_exposure_lookalikes }
    reasoning:
      schema: autopilot.plan.v1
      promptText: |
        You review the organisation's external exposure: what an attacker finds first about its OWN verified
        domains (certificate transparency, DNS and mail posture, its own public websites, lookalike domains).
        Each check ends with "verdict OK" or "verdict ESCALATE". For every ESCALATE verdict propose one
        workitem.intake: type case; title = the check and the problem in a few words; priority high for a
        credential or key on a website, a possible subdomain takeover or a lookalike WITH MX, normal otherwise
        (low for an unverified domain); note = the fact lines unchanged (secrets appear only as masked preview
        and SHA-256 — never ask for or reconstruct the value), then the recommended response for a person
        (remove the page or value, rotate the credential, fix the DNS record, consider a takedown).
        The item summary is one line; cite the check's SOURCE id. Propose nothing for OK verdicts.
        Never claim a problem is fixed. An escalated check that no item cites is filed by the engine.
        日本語で要約してください。
    actions: [workitem.intake]
    level: L1
    limits: { maxItemsPerRun: 10, maxActionsPerDay: 20 }
    queue: sec-incidents
    metrics: { baselineMinutes: 60 }
  - id: guardian-exposure-people
    edition: core
    area: security
    name: { ja: 個人の露出チェック（同意者のみ）, en: Personal exposure check (consented people only) }
    trigger: { schedule: "10 4 * * 1", tz: Asia/Tokyo }
    gather:
      - { id: people, tool: guardian_exposure_people }
    reasoning:
      schema: autopilot.plan.v1
      promptText: |
        You review personal exposure checks for people who enrolled and consented. People are named only by
        enrolment id (pe-…); never ask for, guess or add a name, email address, phone number or anything
        about them beyond the facts. For every ESCALATE verdict propose one workitem.intake: type case;
        priority normal (high for a possible impersonation); title = the enrolment id and the problem in a few
        words; note = the fact lines unchanged, then the recommended response (change the breached password
        and turn on multi-factor sign-in, report the impersonating account to the platform, remove the
        address from the page). "no consent" is one low-priority item. The item summary is one line; cite the
        check's SOURCE id. Never claim a problem is fixed.
        日本語で要約してください。
    actions: [workitem.intake]
    level: L1
    limits: { maxItemsPerRun: 20, maxActionsPerDay: 20 }
    queue: sec-personal
    metrics: { baselineMinutes: 30 }
